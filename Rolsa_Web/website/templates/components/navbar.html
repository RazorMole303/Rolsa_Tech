{% load static %}
{% load django_bootstrap5 %}

    <!-- Navbar -->
 <nav class="navbar navbar-expand-lg bg-transparent ">
  <div class="container-fluid ">

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <!-- Link for the Home button -->
          <a class="nav-link active" aria-current="page" href="{%url '' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{%url 'about' %}">About Us</a>
        </li>
        <li class="nav-item">
          <!-- Link for the Store button -->
          <a class="nav-link" href="{% url 'store' %}">Store</a>
        </li>
        <!-- Link for the Login and logout button makes sure user isn't logged in to display login, must be logged in to see  -->
        {%if not user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'login' %}">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'register' %}">Register</a>
        </li>
        {% else %}
        <li class="nav-item">
          <form  method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="nav-link">Logout</button>
          </form>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'calculator' %}">Carbon Calculator</a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
